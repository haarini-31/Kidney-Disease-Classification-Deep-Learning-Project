services:
  - type: web
    name: renalscan-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: renalscan-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /data/uploads
    disk:
      name: uploads-disk
      mountPath: /data/uploads
      sizeGB: 1

databases:
  - name: renalscan-db
    plan: free
